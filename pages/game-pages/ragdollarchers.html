<!DOCTYPE html>
<html lang="en">
<head>
<title>Ragdoll Archers</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: #111;
        position: relative;
        min-height: 100vh;
        box-sizing: border-box;
    }
    .game-embed {
        display: block;
        width: 100vw;
        height: calc(100vh - 60px);
        border: none;
        background: #222;
    }
    .taskbar {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100vw;
        height: 60px;
        background: rgba(20,20,20,0.98);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        box-shadow: 0 -2px 8px #0008;
        z-index: 100;
        padding: 0 24px;
    }
    .taskbar button {
        background: #222;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 22px;
        font-size: 18px;
        cursor: pointer;
        margin-left: 8px;
        transition: background 0.2s;
    }
    .taskbar button:hover {
        background: #444;
    }

    .launcher { height: calc(100vh - 60px); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-family: sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    .launcher h1 { margin: 0 0 8px; font-size: 40px; }
    .launcher p { margin: 6px 0; max-width: 460px; color: #ddd; }
    .launcher .small { color: #888; font-size: 14px; }
    .launcher .play { margin-top: 22px; padding: 14px 34px; border-radius: 10px; background: #2d6cff; color: #fff; font-size: 20px; text-decoration: none; }
    .launcher .play:hover { background: #4a82ff; }
</style>
</head>
<body>

    <div class="launcher">
      <h1>Ragdoll Archers</h1>
      <p>A ragdoll archery duel: aim, shoot and outlast your opponent.</p>
      <p class="small">This game is hosted by CrazyGames, so it opens in a new tab on their official page.</p>
      <a class="play" href="https://www.crazygames.com/game/ragdoll-archers" target="_blank" rel="noopener">Play on CrazyGames</a>
    </div>
    <div class="taskbar">
      <button onclick="window.location.href='../../select.html'">Back</button>
    </div>
        <script>
            
        </script>

<script>
(function() {
  try {
    var PAGE = 'pages/game-pages/ragdollarchers.html';
    var TITLE = document.title || PAGE;
    var raw = localStorage.getItem('dotgui_recent') || '[]';
    var arr = JSON.parse(raw);
    if (!Array.isArray(arr)) arr = [];
    arr = arr.filter(function(r) { return r && r.page !== PAGE; });
    arr.unshift({page: PAGE, title: TITLE});
    arr = arr.slice(0, 4);
    localStorage.setItem('dotgui_recent', JSON.stringify(arr));
  } catch (e) {}
})();
</script>
<script>
function goFullscreen() {
  var el = document.getElementById('gameEmbed');
  if (!el) return;
  try {
    if (el.requestFullscreen) { el.requestFullscreen(); }
    else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
    else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
  } catch (e) { alert('Fullscreen blocked by browser.'); }
}
</script>
<script>
          // dotgui-panic: global panic key, guards typing
          document.addEventListener('keydown', function(e) {
            var t = e.target;
            if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
            var key = '';
            try { key = localStorage.getItem('dotgui_panic_key') || 'k'; } catch (err) { key = 'k'; }
            if ((e.key || '').toLowerCase() !== (key || '').toLowerCase() || !key) return;
            try {
              document.title = 'Google';
              var f = document.querySelector("link[rel~='icon']");
              if (f) f.href = 'https://www.google.com/favicon.ico';
            } catch (err) {}
            var go = true, url = 'https://classroom.google.com';
            try {
              go = (localStorage.getItem('dotgui_panic_redirect') || 'true') === 'true';
              url = localStorage.getItem('dotgui_panic_url') || url;
            } catch (err) {}
            if (go && url) window.location.href = url;
          });
        </script>
</body>
<script src="../../auth.js?v=14"></script><script src="../../cloak.js"></script>
</html>
