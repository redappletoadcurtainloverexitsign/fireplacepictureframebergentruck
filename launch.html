<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch Nova Games</title>



  <link rel="stylesheet" href="styles.css">
<script src="auth.js?v=4"></script>
</head>
<body>
  <div id="games">
    <main>
      <h1>Launching Nova Games...</h1>
      <p id="launch-status">Opening Nova Games automatically. If it does not appear, allow pop-ups and try again.</p>
      <button class="button" id="launch-button" type="button">Launch</button>
    </main>
  </div>

  <script>
    function launch() {
      const status = document.getElementById('launch-status');

      const win = window.open('about:blank', '_blank');

      if (!win) {
        if (status) {
          status.textContent = 'Popup blocked. Allow pop-ups or click the button below to open Nova Games.';
        }
        return;
      }

      win.document.open();
      win.document.write(`
        <!doctype html>
        <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Nova Games</title>
            <style>
              html, body, iframe {
                width: 100%;
                height: 100%;
                margin: 0;
                border: 0;
                overflow: hidden;
              }
            </style>
          </head>
          <body>
            <iframe src="start.html" title="Nova Games"></iframe>
          </body>
        </html>
      `);
      win.document.close();
      win.focus();

      if (status) {
        status.textContent = 'Nova Games is opening in a new tab.';
      }
    }

    document.getElementById('launch-button').addEventListener('click', launch);
    window.addEventListener('load', () => {
      setTimeout(launch, 250);
    });
  </script>
</body>
</html>
